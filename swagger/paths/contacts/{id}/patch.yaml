tags:
  - Contacts
summary: Update contact partially
operationId: patchContact
description: 'Update one or more fields of a contact by id'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '6878f75621b7a595df899b97'
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            description: 'Contact name'
            example: 'Felix Broe'
          phoneNumber:
            type: string
            description: 'Contact phone number'
            example: '+384508783569'
          email:
            type: string
            description: 'Contact email'
            example: 'anja.t0410@gmail.com'
          isFavourite:
            type: boolean
            description: 'Is contact in favourites'
            example: false
          contactType:
            type: string
            enum: [work, home, personal]
            description: 'Type of contact'
            example: personal
          photo:
            type: string
            format: binary
            description: 'Contact photo'
responses:
  '200':
    description: Successfully patched a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully updated a contact!
            data:
              $ref: '../../../components/schemas/contact.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/contact/404.yaml'
