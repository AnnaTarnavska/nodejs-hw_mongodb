tags:
  - Auth
summary: Login user
operationId: loginUser
description: 'Authenticate user with email and password and receive access token'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            type: string
            format: email
            example: 'example@gmail.com'
          password:
            type: string
            example: 'drjQ4EM5ep'
security: []
responses:
  '200':
    description: Successfully logged in an user!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully logged in an user!'
            data:
              type: object
              properties:
                accessToken:
                  type: string
                  example: 'g99qkhV3OJb+MYrS1m1U4P5LHT1EJJ5B50vhAzuC'
  '401':
    $ref: ../../../components/responses/401.yaml
